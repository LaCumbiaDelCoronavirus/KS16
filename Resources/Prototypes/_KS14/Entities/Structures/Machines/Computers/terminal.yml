- type: entity
  parent: BaseComputer
  id: LuaTerminalComputer
  name: odd terminal
  desc: A terminal is open on it. A label on the side reads something...
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm_syndie
    - map: ["computerLayerKeys"]
      state: syndie_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#f71713"
  - type: DeviceLinkSource
    ports:
      - TerminalOut
  - type: DeviceLinkSink
    ports:
      - TerminalIn
  - type: Computer
    board: LuaTerminalComputerCircuitBoard
  - type: Terminal

- type: entity
  parent: BaseComputerCircuitboard
  id: LuaTerminalComputerCircuitBoard
  name: terminal computer board
  description: A computer printed circuit board for a lua console.
  components:
    - type: Sprite
      state: cpu_medical
    - type: ComputerBoard
      prototype: ComputerLuaTerminal
